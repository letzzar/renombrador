name: Publicar imagen Docker

# Construye la imagen del servicio (binario daemon) y la publica:
#   - Docker Hub  -> <DOCKERHUB_USERNAME>/renombrador     (si hay secrets)
#   - GHCR        -> ghcr.io/<owner>/renombrador          (siempre)
#
# Para Docker Hub, añade en el repo (Settings -> Secrets and variables ->
# Actions) estos dos secrets:
#   DOCKERHUB_USERNAME = tu usuario de Docker Hub
#   DOCKERHUB_TOKEN    = un Access Token (Docker Hub -> Account -> Security)

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  workflow_dispatch:

# Cancela una ejecución anterior si llega un push nuevo a la misma rama.
concurrency:
  group: docker-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Calcula la lista de imágenes destino: GHCR siempre, Docker Hub si hay secret.
      - name: Preparar destinos
        id: cfg
        env:
          DH: ${{ secrets.DOCKERHUB_USERNAME }}
        run: |
          imgs="ghcr.io/${GITHUB_REPOSITORY,,}"
          if [ -n "$DH" ]; then imgs="$imgs"$'\n'"$DH/renombrador"; fi
          {
            echo "images<<EOF"
            echo "$imgs"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"
          if [ -n "$DH" ]; then echo "dockerhub=true" >> "$GITHUB_OUTPUT"; else echo "dockerhub=false" >> "$GITHUB_OUTPUT"; fi

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login en GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Login en Docker Hub
        if: steps.cfg.outputs.dockerhub == 'true'
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Metadatos (tags y labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.cfg.outputs.images }}
          tags: |
            type=raw,value=latest,enable={{is_default_branch}}
            type=ref,event=tag
            type=sha,format=short

      # Solo amd64 (lo habitual en Synology x86 y la mayoría de servidores).
      # Si necesitas ARM, añade ",linux/arm64" — pero compila Rust por emulación
      # (QEMU) y tarda bastante más.
      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
