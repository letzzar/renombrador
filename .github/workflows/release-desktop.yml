name: Publicar apps de escritorio

# Compila la GUI para macOS (universal Intel + Apple Silicon), Windows (x64) y
# Linux (x86_64 y aarch64), las empaqueta y sube como assets de un GitHub
# Release (descargables públicamente). El *servicio* Docker se publica por
# separado en docker-publish.yml, que también se dispara con estos tags: lo de
# aquí es la app de escritorio, no el daemon.
#
# Se dispara al hacer push de un tag `vX.Y.Z` (p. ej. `git tag v1.0.0 &&
# git push origin v1.0.0`) o manualmente desde la pestaña Actions.

on:
  push:
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # necesario para crear el Release y subir assets

jobs:
  # ---------------------------------------------------------------- macOS ----
  build-macos:
    runs-on: macos-14   # Apple Silicon; compila ambas arquitecturas por target
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Instalar targets Rust
        run: rustup target add x86_64-apple-darwin aarch64-apple-darwin

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar universal (arm64 + x86_64)
        run: |
          cargo build --release --features gui --bin renombrador-gui \
            --target aarch64-apple-darwin --target x86_64-apple-darwin
          mkdir -p dist
          lipo -create -output dist/renombrador-gui \
            target/aarch64-apple-darwin/release/renombrador-gui \
            target/x86_64-apple-darwin/release/renombrador-gui
          lipo -info dist/renombrador-gui

      - name: Empaquetar .app
        run: |
          cargo install cargo-bundle --locked
          cargo bundle --release --features gui --bin renombrador-gui
          APP="target/release/bundle/osx/Renombrador.app"
          # Sustituir el binario del bundle por el universal.
          cp dist/renombrador-gui "$APP/Contents/MacOS/renombrador-gui"
          lipo -info "$APP/Contents/MacOS/renombrador-gui"
          # Firma ad-hoc (sin cuenta de Apple Developer). Limpiar xattrs antes.
          xattr -cr "$APP"
          codesign --force --deep --sign - "$APP"
          codesign --verify --verbose "$APP"

      - name: Generar fondo del DMG
        run: |
          mkdir -p dist/bg
          swift packaging/macos/make_bg.swift dist/bg

      - name: Crear .dmg con layout
        run: |
          brew install create-dmg
          APP="target/release/bundle/osx/Renombrador.app"
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          DMG="dist/Renombrador-${VERSION}-universal.dmg"
          # create-dmg envuelve el AppleScript de Finder con reintentos (robusto en CI).
          create-dmg \
            --volname "Renombrador" \
            --background dist/bg/background.png \
            --window-pos 200 120 \
            --window-size 600 400 \
            --icon-size 112 \
            --icon "Renombrador.app" 150 205 \
            --app-drop-link 450 205 \
            --hide-extension "Renombrador.app" \
            "$DMG" \
            "$APP" \
            || create-dmg --volname "Renombrador" "$DMG" "$APP"  # fallback sin estilo

      - name: Comprimir .app (zip)
        run: |
          APP="target/release/bundle/osx/Renombrador.app"
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          ditto -c -k --keepParent "$APP" "dist/Renombrador-${VERSION}-universal.app.zip"

      - name: Subir artefactos macOS al workflow
        uses: actions/upload-artifact@v4
        with:
          name: macos-build
          path: |
            dist/*.dmg
            dist/*.app.zip

      - name: Publicar macOS en el Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.dmg
            dist/*.app.zip

  # -------------------------------------------------------------- Windows ----
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2

      - name: Compilar GUI (x64)
        run: cargo build --release --features gui --bin renombrador-gui

      - name: Empaquetar .zip
        shell: pwsh
        run: |
          $version = "$env:GITHUB_REF_NAME" -replace '^v',''
          if (-not $version) { $version = "dev" }
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          # Nombre amigable del ejecutable dentro del zip.
          Copy-Item target/release/renombrador-gui.exe dist/Renombrador.exe
          Compress-Archive -Path dist/Renombrador.exe `
            -DestinationPath "dist/Renombrador-$version-windows-x64.zip" -Force

      - name: Subir artefacto Windows al workflow
        uses: actions/upload-artifact@v4
        with:
          name: windows-build
          path: dist/*.zip

      - name: Publicar Windows en el Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.zip

  # ---------------------------------------------------------------- Linux ----
  # Una compilación nativa por arquitectura, no cross-compiling: la GUI enlaza
  # con GTK, X11 y Wayland del sistema, y montar ese sysroot cruzado da mucha
  # más guerra que usar el runner ARM, que en repos públicos es gratis.
  build-linux:
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            arch: x86_64
          - runner: ubuntu-22.04-arm
            arch: aarch64
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # Se compila sobre 22.04 (glibc 2.35) a propósito, no sobre la última:
      # un binario enlazado contra una glibc más nueva no arranca en sistemas
      # más viejos, y el error que da no dice por qué.
      - name: Dependencias de la GUI
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config \
            libgtk-3-dev \
            libxkbcommon-dev \
            libwayland-dev \
            libxcb-render0-dev libxcb-shape0-dev libxcb-xfixes0-dev \
            libx11-dev libxi-dev libxcursor-dev libxrandr-dev \
            libgl1-mesa-dev

      - name: Cache de cargo
        uses: Swatinem/rust-cache@v2
        with:
          key: linux-${{ matrix.arch }}

      - name: Compilar GUI
        run: cargo build --release --features gui --bin renombrador-gui

      - name: Empaquetar .tar.gz
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          [ -z "$VERSION" ] && VERSION="dev"
          mkdir -p dist/pkg
          # Nombre amigable dentro del paquete, igual que en Windows.
          cp target/release/renombrador-gui dist/pkg/Renombrador
          strip dist/pkg/Renombrador
          cp LICENSE dist/pkg/
          # Las bibliotecas van enlazadas dinámicamente: sin esta nota, en un
          # sistema pelado el binario falla con un error de .so ilegible.
          cat > dist/pkg/LEEME.txt <<'EOF'
          Renombrador — app de escritorio para Linux

          Ejecuta ./Renombrador

          Necesita estas bibliotecas del sistema (presentes en cualquier
          escritorio normal; en una instalación mínima, instálalas):

            Debian/Ubuntu:
              sudo apt install libgtk-3-0 libxkbcommon0 libwayland-client0 \
                libxcb1 libx11-6 libxi6 libxcursor1 libxrandr2 libgl1

            Fedora:
              sudo dnf install gtk3 libxkbcommon libwayland-client libxcb \
                libX11 libXi libXcursor libXrandr mesa-libGL

          Compilado sobre glibc 2.35 (Ubuntu 22.04): funciona en Debian 12+,
          Ubuntu 22.04+ y equivalentes.

          El servicio para NAS/servidor no es esto: es la imagen Docker
          letzzar/renombrador. Ver DOCKER.md.
          EOF
          tar -czf "dist/Renombrador-${VERSION}-linux-${{ matrix.arch }}.tar.gz" \
            -C dist/pkg .
          ls -l dist/

      - name: Subir artefacto Linux al workflow
        uses: actions/upload-artifact@v4
        with:
          name: linux-${{ matrix.arch }}-build
          path: dist/*.tar.gz

      - name: Publicar Linux en el Release (solo tags)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.tar.gz
